name: OOXML Conformance

on:
  schedule:
    # Weekly: re-capture truth from LibreOffice, compare against renderer
    - cron: "0 3 * * 1"  # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      threshold:
        description: "Regression threshold (fidelity drop allowed)"
        required: false
        default: "0.05"
      recapture_truth:
        description: "Re-capture truth from LibreOffice (use on schedule)"
        required: false
        default: "false"
  pull_request:
    paths:
      - "conformance/**"
      - "conformance-docx/**"
      - "harness-graph/**"
      - "tf-test-harness/**"
      - "census/**"
      - "sheet-oracle/**"
      - "scope/**"

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-tests:
    name: Unit tests (wo-conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve server rev pinned in Cargo.lock
        id: rev
        run: echo "rev=$(grep -o 'server.git?branch=main#[0-9a-f]*' Cargo.lock | head -1 | grep -o '[0-9a-f]\{40\}$')" >> "$GITHUB_OUTPUT"

      - name: Clone server at the Cargo.lock-pinned renderer rev (OUTSIDE the workspace tree)
        # cargo clones a git dep's SUBMODULES and the public server repo
        # carries a private submodule (scripts/taskfleet) runners can't fetch;
        # the cargo jobs clone the public repo instead of cargo's git fetch.
        # Cloning to $RUNNER_TEMP (not $GITHUB_WORKSPACE) matters too: cargo
        # ignores a NESTED [workspace] and would inherit `workspace = true`
        # deps from the harness root, breaking wo-docx-renderer
        # (pdf-writer not found).
        env:
          SERVER_REV: ${{ steps.rev.outputs.rev }}
        run: |
          git clone --quiet --depth 1 --branch main \
            https://github.com/World-Office/server.git "$RUNNER_TEMP/server"
          git -C "$RUNNER_TEMP/server" checkout --quiet "$SERVER_REV" 2>/dev/null || {
            git -C "$RUNNER_TEMP/server" fetch --quiet --depth 1 origin "$SERVER_REV"
            git -C "$RUNNER_TEMP/server" checkout --quiet FETCH_HEAD
          }

      - name: Point conformance-docx at the cloned crates
        run: bash scripts/ci-server-path-deps.sh "$RUNNER_TEMP/server"

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install poppler (pdftotext for the PDF projection adapter)
        run: pdftotext -v || sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Test wo-conformance (lib + integration)
        run: cargo test -p wo-conformance -- --test-threads=1

  harness-graph:
    name: Harness graph drift gate (features.yaml ↔ graph.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out World-Office/server (inventoried by seed.py)
        uses: actions/checkout@v4
        with:
          repository: World-Office/server
          path: server

      - name: Install PyYAML
        run: python3 -m pip install --break-system-packages pyyaml

      - name: Drift gate
        env:
          WO_SERVER_DIR: ${{ github.workspace }}/server
        run: python3 harness-graph/seed.py --check

  port-graph:
    # HE-1: port-state graph gate (census/port-graph/ - the OO->react port
    # graph). build.py + done-gate.py are pure stdlib over committed census
    # artifacts: no server clone, no node, no network - seconds, fails fast.
    name: Port-state graph gate (build union self-assert + stale graph + done-gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot the committed graph.json (staleness reference)
        run: cp census/port-graph/graph.json "$RUNNER_TEMP/graph.committed.json"

      - name: Build graph.json (v3 union self-assert)
        # Rebuilds the derived graph from the committed census artifacts and
        # self-asserts union completeness - a source-manifest row
        # (census/oo-source/) without a graph row exits non-zero, so
        # rubber-stamped manifests fail loudly instead of passing silently.
        run: /usr/bin/python3 census/port-graph/build.py

      - name: Stale-graph check (rebuild must reproduce the committed graph.json)
        # build.py restamps the wall-clock "generated" field on every run, so
        # a raw `git diff --exit-code` can never pass; compare the graph
        # content with that one stamp stripped - any other drift fails here.
        run: |
          /usr/bin/python3 - "$RUNNER_TEMP/graph.committed.json" <<'PY'
          import json, sys
          from pathlib import Path

          def load(path):
              graph = json.loads(Path(path).read_text())
              graph.pop("generated", None)  # wall-clock stamp, not content
              return graph

          committed = load(sys.argv[1])
          rebuilt = load("census/port-graph/graph.json")
          if committed != rebuilt:
              print("STALE census/port-graph/graph.json: rebuild differs from\n"
                    "the committed graph. Regenerate and commit:\n"
                    "  /usr/bin/python3 census/port-graph/build.py", file=sys.stderr)
              sys.exit(1)
          print("graph.json fresh: rebuild reproduces the committed graph "
                "(modulo the generated stamp)")
          PY

      - name: Done gate (strict - undocumented-missing controls fail)
        run: /usr/bin/python3 census/port-graph/done-gate.py --strict

  census-ledger:
    name: Parity ledger gate (census-wo ↔ MAP, reconcile --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PKG-001 contract, offline and fast: committed level-ledger has no
      # silently parked row, and the build guard still trips on a synthetic
      # one. Runs before the expensive setup so a regression fails fast.
      - name: No silently parked ledger rows (PKG-001 contract, offline)
        run: python3 census/ledger/test-no-parked.py

      - name: Check out World-Office/server (spawned by reconcile.py)
        uses: actions/checkout@v4
        with:
          repository: World-Office/server
          path: server

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Build wo-docserver (rust mode is the reconcile default)
        run: cargo build -p wo-docserver -p mcp-server
        working-directory: server

      - name: Install pnpm + wasm-pack (word editor UI for the rust docserver)
        # The vanilla wysiwyg app was retired 2026-11-16; the rust docserver
        # now serves the React editor, which must be built before reconcile
        # can capture /word/ (the census waits for the React #toolbar).
        # pnpm version comes from the server repo's packageManager field
        # (pnpm@10.4.1); wasm-pack pinned to v0.15.0 (exact-version URL;
        # "latest/download" with a versioned asset name does not resolve).
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: server/package.json
      - name: Install wasm-pack (throttle-proof, then cargo fallback)
        run: |
          if command -v wasm-pack >/dev/null 2>&1; then echo "wasm-pack present"; exit 0; fi
          if curl -L -f -s --retry 3 --retry-delay 5 https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/wp.tgz \
             && tar -xzf /tmp/wp.tgz -C /tmp \
             && sudo mv /tmp/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/; then
            wasm-pack --version; exit 0
          fi
          echo "binary download failed, falling back to cargo install"
          cargo install wasm-pack --locked
          wasm-pack --version

      - name: Build the word editor UI (filtered to the doc editor)
        working-directory: server
        run: |
          pnpm install --frozen-lockfile
          pnpm exec turbo run build --filter='@world-office/documenteditor'
          mkdir -p frontend-dist
          cp -r apps/web/apps/documenteditor-react/dist frontend-dist/word
        env:
          TURBO_CONCURRENCY: "2"
          NODE_OPTIONS: --max-old-space-size=3072

      - name: Install Python deps (pyyaml only — seed.py; the Python
                docserver was decommissioned 2026-10-14, reconcile spawns
                the rust binary built above)
        run: python3 -m pip install --break-system-packages \
          pyyaml

      - name: Install Node + Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: census/package-lock.json

      - name: npm ci (skip the playwright postinstall browser download)
        working-directory: census
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --ignore-scripts

      - name: Playwright Chromium
        working-directory: census
        run: npx playwright install --with-deps chromium

      - name: One-run ledger gate (fresh capture + diff + gate + seed)
        env:
          WO_SERVER_DIR: ${{ github.workspace }}/server
        run: python3 census/reconcile.py --check --seed-check --interactions --fx --geometry --ai


  cross-engine-fidelity:
    name: Cross-engine fidelity (wo-docx-renderer vs LibreOffice)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Resolve server rev pinned in Cargo.lock
        id: rev
        run: echo "rev=$(grep -o 'server.git?branch=main#[0-9a-f]*' Cargo.lock | head -1 | grep -o '[0-9a-f]\{40\}$')" >> "$GITHUB_OUTPUT"

      - name: Clone server at the Cargo.lock-pinned renderer rev (OUTSIDE the workspace tree)
        # cargo clones a git dep's SUBMODULES and the public server repo
        # carries a private submodule (scripts/taskfleet) runners can't fetch;
        # the cargo jobs clone the public repo instead of cargo's git fetch.
        # Cloning to $RUNNER_TEMP (not $GITHUB_WORKSPACE) matters too: cargo
        # ignores a NESTED [workspace] and would inherit `workspace = true`
        # deps from the harness root, breaking wo-docx-renderer
        # (pdf-writer not found).
        env:
          SERVER_REV: ${{ steps.rev.outputs.rev }}
        run: |
          git clone --quiet --depth 1 --branch main \
            https://github.com/World-Office/server.git "$RUNNER_TEMP/server"
          git -C "$RUNNER_TEMP/server" checkout --quiet "$SERVER_REV" 2>/dev/null || {
            git -C "$RUNNER_TEMP/server" fetch --quiet --depth 1 origin "$SERVER_REV"
            git -C "$RUNNER_TEMP/server" checkout --quiet FETCH_HEAD
          }

      - name: Point conformance-docx at the cloned crates
        run: bash scripts/ci-server-path-deps.sh "$RUNNER_TEMP/server"

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui
          libreoffice --version

      - name: Install Python dependencies
        run: python3 -m pip install --break-system-packages pymupdf

      - name: Build wo-render-ir (conformance-docx)
        run: cargo build -p wo-conformance-docx --bin wo-render-ir

      - name: Generate corpus (if missing)
        run: |
          cd conformance
          if [ ! -d corpus/cases ] || [ -z "$(ls corpus/cases/*.docx 2>/dev/null)" ]; then
            python3 scripts/generate-corpus.py corpus/cases
          fi

      # Only re-capture truth on schedule or manual dispatch with recapture_truth=true.
      # On PRs, use the committed truth to compare against the engine.
      - name: Capture truth from LibreOffice
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.recapture_truth == 'true')
        run: |
          cd conformance
          python3 scripts/capture-truth.py capture corpus --force

      - name: Render corpus through wo-docx-renderer
        run: |
          cd conformance
          BIN="$(realpath ../target/debug/wo-render-ir)"
          for docx in corpus/cases/*.docx; do
            stem="$(basename "$docx" .docx)"
            "$BIN" "$docx" "corpus/cases/${stem}.engine.json"
          done

      - name: Compare engines
        run: |
          cd conformance
          python3 scripts/capture-truth.py compare corpus

      - name: Check regression
        run: |
          cd conformance
          THRESHOLD="${{ github.event.inputs.threshold || '0.05' }}"
          python3 scripts/capture-truth.py regression corpus --threshold "$THRESHOLD"

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: |
            conformance/corpus/comparison-*.json
            conformance/corpus/baseline.json
          retention-days: 90

  onlyoffice-oracle:
    # Nightly: record OnlyOffice behavior (the CI-runnable oracle) and diff it
    # against the committed reference truth. Heavy container — never on PRs.
    name: OnlyOffice oracle (pinned DS, corpus capture + cross-engine diff)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve server rev pinned in Cargo.lock
        id: rev
        run: echo "rev=$(grep -o 'server.git?branch=main#[0-9a-f]*' Cargo.lock | head -1 | grep -o '[0-9a-f]\{40\}$')" >> "$GITHUB_OUTPUT"

      - name: Clone server at the Cargo.lock-pinned rev (OUTSIDE the workspace tree)
        # Same submodule / nested-workspace reasons as unit-tests: cargo
        # fetches a git dep's SUBMODULES (private scripts/taskfleet), and a
        # checkout inside the workspace breaks inherited deps.
        env:
          SERVER_REV: ${{ steps.rev.outputs.rev }}
        run: |
          git clone --quiet --depth 1 --branch main \
            https://github.com/World-Office/server.git "$RUNNER_TEMP/server"
          git -C "$RUNNER_TEMP/server" checkout --quiet "$SERVER_REV" 2>/dev/null || {
            git -C "$RUNNER_TEMP/server" fetch --quiet --depth 1 origin "$SERVER_REV"
            git -C "$RUNNER_TEMP/server" checkout --quiet FETCH_HEAD
          }
          bash scripts/ci-server-path-deps.sh "$RUNNER_TEMP/server"

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install poppler (pdftotext)
        run: pdftotext -v || sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Start pinned OnlyOffice Document Server
        run: |
          source conformance/scripts/onlyoffice-image.env
          docker run -d --name oo-oracle -p 9980:80 \
            -e JWT_ENABLED=true -e JWT_SECRET=devsecret \
            "${OO_DS_IMAGE}"
          for i in $(seq 1 60); do
            if [ "$(curl -s http://127.0.0.1:9980/healthcheck)" = "true" ]; then break; fi
            sleep 5
          done
          [ "$(curl -s http://127.0.0.1:9980/healthcheck)" = "true" ] || { docker logs oo-oracle | tail -50; exit 1; }

      - name: Live adapter test
        env:
          OO_DS_URL: http://127.0.0.1:9980
          OO_DS_JWT: devsecret
          OO_DS_PUBLIC_HOST: 172.17.0.1
        run: cargo test -p wo-conformance --test onlyoffice_live -- --ignored

      - name: Capture OnlyOffice goldens for the corpus
        working-directory: conformance
        env:
          OO_DS_URL: http://127.0.0.1:9980
          OO_DS_JWT: devsecret
          OO_DS_PUBLIC_HOST: 172.17.0.1
        run: bash scripts/capture-onlyoffice.sh corpus/cases

      - name: Cross-engine diff (OnlyOffice vs reference truth)
        working-directory: conformance
        run: bash scripts/capture-onlyoffice.sh corpus/cases --diff-only

      - name: Upload oracle report + goldens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onlyoffice-oracle
          path: |
            conformance/corpus/cases/*.onlyoffice.json
            conformance/corpus/oracle-report-*.txt
          retention-days: 90

  scope-and-sheet-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-calc python3-yaml
      - name: Scope honesty gate
        run: python3 scope/report.py --check
      - name: Truth drift (LibreOffice recapture must equal committed truth)
        run: |
          cp sheet-oracle/truth.json /tmp/truth.committed.json
          python3 sheet-oracle/oracle.py capture
          diff /tmp/truth.committed.json sheet-oracle/truth.json

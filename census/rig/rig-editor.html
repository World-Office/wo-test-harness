<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>OO Rig Editor</title>
<script type="text/javascript" src="http://127.0.0.1:8099/web-apps/apps/api/documents/api.js"></script>
<style>html,body,#placeholder{width:100%;height:100%;margin:0;padding:0}</style>
</head>
<body>
<div id="placeholder"></div>
<script type="text/javascript">
  window.docEditor = new DocsAPI.DocEditor("placeholder", {
    width: "100%", height: "100%",
    documentType: "word",
    document: {
      title: "demo.docx",
      url: "http://host.docker.internal:8735/demo.docx",
      fileType: "docx",
      key: "rig-demo-001",
      permissions: { edit: true, download: true, print: true, comment: true }
    },
    editorConfig: {
      mode: "edit",
      lang: "en",
      callbackUrl: "http://host.docker.internal:8735/cb",
      user: { id: "rig", name: "Rig Capture" },
      customization: { autosave: false, forcesave: false, feedback: false, help: true }
    },
    events: { onAppReady: function () { console.log("RIG_APP_READY"); } }
  });
</script>
</body>
</html>

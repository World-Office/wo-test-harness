[package]
name = "wo-conformance"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Engine-agnostic OOXML rendering conformance harness — scores any engine (ours, LibreOffice, OnlyOffice, Word) against captured ground truth via a normalized box-tree IR."

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
roxmltree = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json"] }


[dev-dependencies]
zip = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "wo-conformance"
path = "src/main.rs"

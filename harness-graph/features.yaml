  - {id: F-092, area: layout,      name: Margins,                        parity: full,    fidelity: L2,
      divergence: [{ref: canvas-proportions, justification: "Document margins are real: the page-setup dialog writes a .page-setup marker that round-trips through DOCX w:pgMar and ODT page layout, and maps to canvas padding. Paragraph margins serialize as before."}]}

      divergence: [{ref: canvas-2d, justification: "plugins.photoeditor is real (WO-FEA fleet): the photoEditor dialog renders the image to a 2D canvas with brightness/contrast/rotate/crop controls; Save replaces the editor img src with the edited image (data URL). L1 canvas-2D filters, not pixel-perfect raster-parity with OO's dedicated editor."}]}

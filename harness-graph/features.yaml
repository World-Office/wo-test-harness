      divergence: [{ref: model-registry, justification: "plugins.ocr is real (WO-FEA fleet): POST /api/documents/{id}/ai/ocr routes the document through ai_propose_run (the MODEL_REGISTRY pattern) — unregistered vision model returns a loud 503, never a silent stub. The OCR button also offers a one-line propose preset. Output quality depends on the deployment's registered model, like AI grammar (F-142)."}]}

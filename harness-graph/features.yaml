  - {id: F-041, area: home.para,   name: RTL paragraph direction,        parity: partial, fidelity: L1, commands: [directionRtl],
      divergence: [{ref: audit, date: 2026-10-19, justification: "AUDITED 2026-10-19 (bare-row sweep): editor side REAL - directionRtl routes to toggleBlockDirection (block-level style toggle, editor.js:846) with active-state reflection (editor.js:1300); parity with applyLineHeight pattern. FILE-FORMAT GAP (why still partial): wo-ooxml has NO w:bidi handling at all (grep: zero hits in parser.rs/serializer.rs), so RTL paragraph direction is LOST on DOCX/ODT round-trip - the CSS direction:rtl never reaches the file. Fix = parse/emit w:bidi in wo-ooxml pPr + map style.direction in the editor converter bridge; af/feature target, not verification."}]}


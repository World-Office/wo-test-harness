# World-Office feature register — OnlyOffice Document Editor parity
#
# Single source of truth for the parity roadmap. `seed.py` compiles this into
# graph.json (and optionally Neo4j). Rules:
#   - Every feature needs EITHER a covering test (pytest marker `F-###`) OR a
#     `divergence` entry with a justification (the reference is buggy / we
#     deliberately differ).
#   - IDs are stable forever. Never renumber; delete only with a note.
#   - parity: full | partial | missing   (vs OnlyOffice behavior, not pixels)
#   - fidelity: target capture layer for the parity claim
#       L0 spec/XSD conformance   L1 canonical IR snapshot   L2 box-tree geometry
#       L3 perceptual raster      L4 behavior/conversion matrix
version: 1
source: OnlyOffice Document Editor (word processor) feature surface

features:
  # ── file ──────────────────────────────────────────────────────────────────
  - {id: F-001, area: file,        name: Save / autosave to WOPI,        parity: full,    fidelity: L4, commands: [save]}
  - {id: F-002, area: file,        name: Download as ODT,                parity: full,    fidelity: L4}
  - {id: F-003, area: file,        name: Download as DOCX,               parity: full,    fidelity: L1,
      divergence: [{ref: html-projection, justification: "DOCX is produced from the editor HTML projection (html_to_docx), not canvas-true layout; content-faithful, formatting approximate. Canvas-true export tracked as future work."}]}
  - {id: F-004, area: file,        name: Export to PDF,                  parity: full,    fidelity: L1,
      divergence: [{ref: html-projection, justification: "PDF via WeasyPrint from the sanitized editor HTML, not canvas-true layout (L4 pending a renderer-backed path). The historical silent stub-PDF fallback was removed; missing engine now fails loudly (X-Export-Engine header + 500)."}]}
  - {id: F-005, area: file,        name: Print,                          parity: full,    fidelity: L1,
      divergence: [{ref: browser-print, justification: "window.print() via File menu; browser print pipeline, not a layout-true L4 print path."}]}
  - {id: F-006, area: file,        name: Document info / metadata,       parity: full,    fidelity: L1,
      divergence: [{ref: api-surface, justification: "Info exposed as GET /api/documents/{id}/info (name, format, size, timestamps, version); the user-facing properties panel belongs to the OpenCloud shell in the integrated product."}]}


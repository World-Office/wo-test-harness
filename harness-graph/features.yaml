  # ── review ────────────────────────────────────────────────────────────────
  - {id: F-100, area: review,      name: Track changes on/off,           parity: full,    fidelity: L1,
      divergence: [{ref: editor-surface, justification: "btn-track-changes toggles a track-on mode; beforeinput wraps edits in <ins class=\"track-insert\">/<del class=\"track-delete\"> (data-author). Markers round-trip DOCX w:ins/w:del (w:delText) and ODT change marks. Editor is vanilla contenteditable -- canvas-true review rendering (L2+) not claimed."}]}
  - {id: F-101, area: review,      name: Accept / reject change,         parity: full,    fidelity: L1,
      divergence: [{ref: panel-actions, justification: "btn-review-changes lists each tracked region with Accept/Reject (acceptChange/rejectChange); accepted/rejected content serializes to real DOCX. DOM behaviour pinned by source-wiring tests; no canvas-true review UI (L2+)."}]}
  - {id: F-102, area: review,      name: Comment threads (add/reply/resolve), parity: partial, fidelity: L1,
      divergence: [{ref: no-reply-resolve, justification: "Add + delete + anchored serialization proven (span.comment <-> word/comments.xml with commentRangeStart/End/Reference; ODT office:annotation): btn-comment wraps the selection, comments panel lists Go to/Delete. No reply threading or resolve lifecycle exists in the editor UI -- OnlyOffice thread semantics not implemented."}]}
